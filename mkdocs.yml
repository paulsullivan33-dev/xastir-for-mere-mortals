site_name: Xastir for Mere Mortals
site_description: Plain-language APRS mapping with Xastir, the long-lived Linux APRS client. Stations, objects and weather drawn on a map as they are heard, the interfaces that feed it from TNC to APRS-IS, messages and bulletins, and log files played back packet by packet.
site_url: https://paulsullivan33-dev.github.io/xastir-for-mere-mortals/

# Guides live at the repo root (nice for GitHub browsing).
# The deploy workflow copies them into docs/ before building.
theme:
  name: material

